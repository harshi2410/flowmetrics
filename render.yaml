services:
  - type: web
    name: flowmetrics
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: CLIENT_URL
        value: https://flowmetrics.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://flowmetrics.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

